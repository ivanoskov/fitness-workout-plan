<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тренировки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body class="min-w-80 bg-neutral-100 font-sans text-neutral-950 antialiased">
  <main class="mx-auto min-h-dvh max-w-[510px] bg-[#fbfbfa] px-5 pb-28 pt-[env(safe-area-inset-top)] sm:shadow-2xl">
    <header class="flex h-21 items-center border-b border-neutral-200">
      <h1 class="text-[25px] font-semibold tracking-[-0.055em]">Тренировки</h1>
      <span id="timer" class="ml-auto font-medium tabular-nums"></span>
    </header>

    <section id="plan">
      <div id="tabs" class="my-5 grid grid-cols-3 gap-1 rounded-2xl bg-neutral-200 p-1" aria-label="Выбор тренировки"></div>
      <details class="mb-5 rounded-2xl border border-neutral-200 bg-white p-3" id="warmup">
        <summary class="flex cursor-pointer items-center gap-3"><img src="assets/vital/0062.jpg" alt="Велотренажёр" class="size-18 rounded-xl object-cover"><span><b class="block text-sm">Разминка · велотренажёр</b><span class="text-sm text-neutral-500">5–7 минут · лёгкий темп</span></span></summary>
        <video id="warmupVideo" class="mt-3 aspect-square w-full rounded-xl" src="assets/vital/0062.mp4" poster="assets/vital/0062.jpg" muted loop playsinline controls preload="none" aria-label="Велотренажёр"></video>
      </details>
      <p class="mb-3 text-[13px] font-medium text-neutral-500">Основное</p>
      <div id="exerciseList" class="space-y-2"></div>
      <section id="extras" class="mt-5"></section>
    </section>
  </main>

  <button id="start" type="button" class="fixed inset-x-0 bottom-[env(safe-area-inset-bottom)] z-10 mx-auto flex h-16 w-full max-w-[510px] items-center justify-center gap-2 bg-neutral-950 text-[16px] font-semibold text-white shadow-[0_-8px_24px_rgba(0,0,0,.12)] transition-colors hover:bg-neutral-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-950">
    <i class="hgi-stroke hgi-play text-[22px]"></i>Начать
  </button>

  <div id="sessionControls" class="fixed inset-x-0 bottom-0 z-30 mx-auto hidden max-w-[510px] grid-cols-[1fr_2fr] gap-2 border-t border-neutral-200 bg-white p-3 pb-[max(12px,env(safe-area-inset-bottom))]">
    <button id="stop" class="min-h-14 rounded-xl bg-neutral-100 font-semibold">Стоп</button>
    <button id="next" class="min-h-14 rounded-xl bg-neutral-950 font-semibold text-white">Следующее</button>
  </div>
  <aside id="result" class="fixed inset-0 z-40 mx-auto hidden max-w-[510px] overflow-auto bg-[#fbfbfa] px-5 py-10">
    <h2 id="resultTitle" class="text-3xl font-semibold tracking-tight"></h2>
    <div id="resultStats" class="my-6"></div>
    <h3 class="mb-4 text-sm text-neutral-500">Время по упражнениям, включая отдых</h3>
    <div id="chart" class="space-y-4"></div>
    <button id="dismissResult" class="mt-8 min-h-14 w-full rounded-xl bg-neutral-950 font-semibold text-white">К тренировкам</button>
  </aside>
  <aside id="detail" class="fixed inset-0 z-20 mx-auto hidden max-w-[510px] overflow-y-auto bg-[#fbfbfa] px-5 pb-32 pt-[env(safe-area-inset-top)]" aria-hidden="true">
    <header class="flex h-21 items-center justify-between border-b border-neutral-200">
      <button type="button" class="grid size-11 place-items-center rounded-full text-neutral-900 transition-colors hover:bg-neutral-200 focus-visible:outline-2 focus-visible:outline-neutral-950" aria-label="Назад к упражнениям" onclick="closeExercise()"><i class="hgi-stroke hgi-arrow-left-01 text-[23px]"></i></button>
      <span id="step" class="text-[13px] font-medium text-neutral-500"></span><span id="detailTimer" class="text-sm tabular-nums"></span>
    </header>
    <video id="detailVideo" class="mt-5 aspect-square w-full rounded-2xl bg-neutral-100 object-contain" autoplay muted loop playsinline preload="metadata"></video>
    <div id="detailPlaceholder" class="mt-5 hidden aspect-square w-full items-center justify-center rounded-2xl bg-neutral-100 text-sm text-neutral-500">Анимация пока недоступна</div>
    <h2 id="detailName" class="mt-6 text-[30px] font-semibold leading-[1.08] tracking-[-0.055em]"></h2>
    <div class="mt-6 rounded-2xl border border-neutral-200 bg-white p-4">
      <div class="flex items-center justify-between gap-3">
        <button id="minusWeight" aria-label="Уменьшить вес на 0,5 кг" class="size-14 rounded-xl bg-neutral-100 text-3xl">−</button>
        <span class="text-center"><b id="weight" class="text-4xl font-semibold tabular-nums"></b><span class="ml-1 text-neutral-500">кг</span></span>
        <button id="plusWeight" aria-label="Увеличить вес на 0,5 кг" class="size-14 rounded-xl bg-neutral-100 text-3xl">+</button>
      </div>
      <p id="weightNote" class="mt-3 text-center text-xs text-neutral-500"></p>
    </div>
    <div class="mt-6 grid grid-cols-3 gap-3 text-center">
      <div class="rounded-2xl border border-neutral-300 bg-white py-4"><b id="sets" class="block text-[21px] font-semibold tracking-[-0.04em]"></b><span class="mt-1 block text-[12px] leading-tight text-neutral-500">подходы</span></div>
      <div class="rounded-2xl border border-neutral-300 bg-white py-4"><b id="reps" class="block text-[21px] font-semibold tracking-[-0.04em]"></b><span class="mt-1 block text-[12px] leading-tight text-neutral-500">повторы</span></div>
      <div class="rounded-2xl border border-neutral-300 bg-white py-4"><b class="block text-[21px] font-semibold tracking-[-0.04em]">RIR 2</b><span class="mt-1 block text-[12px] leading-tight text-neutral-500">запас</span></div>
    </div>
    <p id="cue" class="mt-5 rounded-2xl border border-neutral-200 bg-white px-4 py-4 text-[14px] leading-relaxed text-neutral-700"></p>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script>
    const media = {
      'Ягодичный мост со штангой': '0057',
      'Приседание со штангой': '0054',
      'Бабочка в тренажёре': '0051',
      'Румынская тяга': '0060',
      'Болгарский сплит-присед с гантелями': '0063',
      'Жим ногами под 45°': '0074',
      'Сгибание ног лёжа': '0075',
      'Жим гантелей сидя': '0080',
      'Разгибание рук с канатом': '0085',
      'Разведения гантелей в стороны': '0096',
      'Обратная бабочка': '0099'
    };
    const workouts = [
      { id: 'A', label: 'A', subtitle: 'Ноги + грудь', items: [
        ['Приседание со штангой', '3', '6–8', 'videos/0043-qXTaZnJ.gif', 'Корпус собран, колени следуют за носками.'],
        ['Жим штанги лёжа', '3', '6–8', 'videos/0025-EIeI8Vf.gif', 'Лопатки сведены и опущены, стопы устойчивы.'],
        ['Тяга верхнего блока', '3', '8–10', 'videos/0198-RVwzP10.gif', 'Тяни локти к рёбрам, не раскачивай корпус.'],
        ['Тяга нижнего блока к поясу', '3', '8–12', 'videos/0861-fUBheHs.gif', 'Не округляй поясницу в конце тяги.'],
        ['Бабочка в тренажёре', '2', '12–15', 'videos/0596-v3xmPAR.gif', 'Сведи руки перед собой, не выводя плечи вперёд.'],
        ['Сгибание рук с EZ-грифом', '3', '10–15', 'videos/0447-6TG6x2w.gif', 'Локти остаются около корпуса.'],
        ['Разгибание рук с канатом', '2', '10–15', 'videos/0241-gAwDzB3.gif', 'Не раскачивай корпус; разгибай локти под контролем.']
      ], extras: [
        ['Разведения гантелей в стороны', '2', '12–15', 'videos/0334-DsgkuIt.gif', 'Поднимай локтями, без рывка и подъёма плеч.'],
        ['Скручивания с канатом на коленях', '2', '10–15', 'videos/0175-WW95auq.gif', 'Сгибай корпус рёбрами к тазу, а не тяни руками.']
      ]},
      { id: 'B', label: 'B', subtitle: 'Грудь + спина', items: [
        ['Румынская тяга', '3', '8–10', 'videos/0085-wQ2c4XD.gif', 'Таз назад, спина нейтральна, штанга близко к ногам.'],
        ['Бабочка в тренажёре', '3', '10–15', null, 'Своди руки под контролем, не выводя плечи вперёд.'],
        ['Тяга гантелей с упором грудью', '3', '8–12', 'videos/0327-7vG5o25.gif', 'Своди лопатки и веди локти назад, не раскачивая корпус.'],
        ['Жим гантелей сидя', '2', '8–10', null, 'Не прогибай поясницу, двигай вес подконтрольно.'],
        ['Разгибание рук с канатом', '2', '10–15', null, 'Не раскачивай корпус; разгибай локти под контролем.']
      ], extras: [
        ['Болгарский сплит-присед с гантелями', '3', '8–10 / нога', null, 'Задняя стопа на скамье. Контролируй колено передней ноги; задняя только помогает.'],
        ['Подъёмы на носки сидя', '3', '10–15', 'videos/0594-bOOdeyc.gif', 'Пауза внизу и полное сокращение наверху.']
      ]},
      { id: 'C', label: 'C', subtitle: 'Спина + руки', items: [
        ['Жим ногами под 45°', '3', '10–12', 'videos/1463-2Qh2J1e.gif', 'Поясница остаётся на спинке; глубина контролируемая.'],
        ['Бабочка в тренажёре', '3', '10–15', 'videos/0596-v3xmPAR.gif', 'Сведи руки перед собой, не выводя плечи вперёд.'],
        ['Тяга верхнего блока узким хватом', '3', '8–10', 'videos/0198-RVwzP10.gif', 'Тяни локти к рёбрам, не раскачивай корпус.'],
        ['Сгибание ног лёжа', '3', '10–15', 'videos/0586-17lJ1kr.gif', 'Таз прижат к тренажёру, движение плавное.'],
        ['Обратная бабочка', '3', '12–15', 'videos/0602-myfUsKf.gif', 'Веди движение задней дельтой и верхом спины.'],
        ['Сгибание рук с EZ-грифом', '3', '10–15', null, 'Локти остаются около корпуса, без раскачивания.'],
        ['Разгибание рук с канатом', '2', '10–15', 'videos/0241-gAwDzB3.gif', 'Не раскачивай корпус; разгибай локти под контролем.']
      ], extras: [
        ['Ягодичный мост со штангой', '2', '10–15', null, 'Опора верхом спины на скамью. Поднимай таз сокращением ягодиц, не переразгибая поясницу.'],
        ['Подъёмы на носки сидя', '3', '10–15', 'videos/0594-bOOdeyc.gif', 'Пауза внизу и полное сокращение наверху.']
      ]}
    ];
    let active = 0;
    let session = null, viewed = null;
    const weights = new Map();
    const $ = selector => document.querySelector(selector);
    function animateIn(targets) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !window.anime) return;
      anime.animate(targets, { opacity: [0, 1], translateY: [10, 0], duration: 260, delay: anime.stagger(35), ease: 'out(3)' });
    }
    function render() {
      const workout = workouts[active];
      $('#tabs').innerHTML = workouts.map((w, i) => `<button type="button" onclick="selectWorkout(${i})" aria-pressed="${i === active}" class="min-h-14 rounded-xl px-3 text-left transition-colors ${i === active ? 'bg-white text-neutral-950 shadow-sm' : 'text-neutral-500 hover:text-neutral-950'}"><span class="block text-[18px] font-semibold leading-none">${w.label}</span><span class="mt-1 block text-[11px] leading-tight">${w.subtitle}</span></button>`).join('');
      $('#exerciseList').innerHTML = workout.items.map((item, index) => exerciseCard(item, index, false)).join('');
      $('#extras').innerHTML = `<h2 class="mb-3 mt-7 text-[13px] font-medium text-neutral-500">Дополнительно, если есть время</h2><div class="space-y-2">${workout.extras.map((item, index) => exerciseCard(item, index, true)).join('')}</div>`;
      animateIn('.exercise-row');
    }
    function exerciseCard(item, index, extra) { return `<button type="button" onclick="openExercise(${index}, ${extra})" class="exercise-row flex min-h-24 w-full items-center gap-3 rounded-2xl border border-neutral-200 bg-white p-3 text-left shadow-[0_1px_1px_rgba(0,0,0,.02)] transition-[border-color,background-color,box-shadow] duration-200 hover:border-neutral-400 hover:bg-neutral-50 hover:shadow-sm focus-visible:outline-2 focus-visible:outline-neutral-950">${media[item[0]] ? `<img loading="lazy" src="assets/vital/${media[item[0]]}.jpg" alt="${item[0]}" class="size-18 shrink-0 rounded-xl bg-neutral-100 object-cover">` : `<span aria-hidden="true" class="size-18 shrink-0 rounded-xl bg-neutral-100"></span>`}<span class="min-w-0 flex-1"><b class="block text-[16px] leading-snug tracking-[-0.02em]">${item[0]}</b><span class="mt-1 block text-[14px] text-neutral-500">${item[1]} × ${item[2]}</span></span><i class="hgi-stroke hgi-arrow-right-01 shrink-0 text-[21px] text-neutral-500"></i></button>`; }
    function selectWorkout(index) { if (session) return; active = index; render(); }
    function openExercise(index, extra = false) {
      if (session && (extra || index !== session.index)) return;
      const collection = extra ? workouts[active].extras : workouts[active].items;
      const item = collection[index];
      viewed = item;
      updateWeight();
      $('#step').textContent = extra ? 'Дополнительно' : `${index + 1}/${workouts[active].items.length}`;
      const id = media[item[0]], video = $('#detailVideo');
      video.pause();
      video.classList.toggle('hidden', !id);
      $('#detailPlaceholder').classList.toggle('hidden', !!id);
      $('#detailPlaceholder').classList.toggle('flex', !id);
      if (id) {
        video.poster = 'assets/vital/' + id + '.jpg';
        video.src = 'assets/vital/' + id + '.mp4';
        video.setAttribute('aria-label', item[0]);
        video.muted = true;
        video.play().catch(() => { video.controls = true; });
      } else { video.removeAttribute('src'); video.removeAttribute('poster'); video.load(); }
      $('#detailName').textContent = item[0]; $('#sets').textContent = item[1]; $('#reps').textContent = item[2]; $('#cue').textContent = item[4];
      const detail = $('#detail'); detail.classList.remove('hidden'); detail.setAttribute('aria-hidden', 'false'); detail.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      tick();
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.anime) anime.animate(detail, { opacity: [0, 1], translateX: [18, 0], duration: 220, ease: 'out(3)' });
    }
    function closeExercise() {
      $('#detailVideo').pause();
      const detail = $('#detail'); detail.classList.add('hidden'); detail.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (session) $('#next').textContent = 'Продолжить';
    }
    function updateWeight() {
      const value = weights.get(viewed[0]);
      $('#weight').textContent = value === undefined ? '—' : value.toLocaleString('ru-RU');
      $('#minusWeight').disabled = value === undefined || value === 0;
      $('#minusWeight').style.opacity = $('#minusWeight').disabled ? '.35' : '1';
      const unit = /гантел|Молотки/.test(viewed[0]) ? 'на одну гантель' : /штанг|гриф/.test(viewed[0]) ? 'общий вес с грифом' : 'вес на тренажёре / отягощение';
      $('#weightNote').textContent = (value === undefined ? 'Вес не задан · ' : '') + unit + ' · шаг 0,5 кг';
    }
    function changeWeight(delta) {
      if (!viewed) return;
      weights.set(viewed[0], Math.max(0, (weights.get(viewed[0]) || 0) + delta));
      updateWeight();
    }
    function formatTime(ms) {
      const seconds = Math.floor(Math.max(0, ms) / 1000);
      return [Math.floor(seconds / 60), seconds % 60].map(n => String(n).padStart(2, '0')).join(':');
    }
    function tick() {
      const text = session ? formatTime(Date.now() - session.start) : '';
      $('#timer').textContent = text; $('#detailTimer').textContent = text;
    }
    function startSession() {
      if (session) return;
      $('#warmupVideo').pause(); $('#warmup').open = false;
      const now = Date.now();
      session = { start: now, exerciseStart: now, index: 0, rows: [] };
      $('#result').classList.add('hidden');
      $('#start').classList.add('hidden');
      $('#sessionControls').classList.remove('hidden');
      $('#sessionControls').classList.add('grid');
      $('#next').textContent = 'Следующее';
      openExercise(0);
    }
    function recordExercise(completed) {
      const now = Date.now();
      const item = workouts[active].items[session.index];
      session.rows.push({ name: item[0], ms: now - session.exerciseStart, completed });
      session.exerciseStart = now;
    }
    function nextExercise() {
      if (!session) return;
      if ($('#detail').classList.contains('hidden')) {
        openExercise(session.index);
      } else {
        recordExercise(true);
        if (session.index === workouts[active].items.length - 1) { finishSession(true); return; }
        session.index++;
        openExercise(session.index);
      }
      $('#next').textContent = session.index === workouts[active].items.length - 1 ? 'Завершить' : 'Следующее';
    }
    function finishSession(completed = false) {
      if (!session) return;
      if (!completed) recordExercise(false);
      const elapsed = Date.now() - session.start;
      const rows = session.rows;
      const count = rows.filter(r => r.completed).length;
      $('#resultTitle').textContent = completed ? 'Тренировка завершена' : 'Тренировка остановлена';
      $('#resultStats').textContent = formatTime(elapsed) + ' · ' + count + ' из ' + workouts[active].items.length + ' упражнений завершено';
      const max = Math.max(1, ...rows.map(r => r.ms));
      $('#chart').replaceChildren();
      rows.forEach(row => {
        const block = document.createElement('div');
        const label = document.createElement('p');
        label.className = 'mb-2 text-sm';
        label.textContent = row.name + (row.completed ? '' : ' · не завершено') + ' — ' + formatTime(row.ms);
        const track = document.createElement('div');
        track.className = 'h-2 rounded-full bg-neutral-200';
        const bar = document.createElement('div');
        bar.className = 'h-2 rounded-full bg-neutral-900';
        bar.style.width = (100 * row.ms / max) + '%';
        track.append(bar); block.append(label, track); $('#chart').append(block);
      });
      session = null; tick(); closeExercise();
      $('#sessionControls').classList.add('hidden'); $('#sessionControls').classList.remove('grid');
      $('#start').classList.remove('hidden'); $('#result').classList.remove('hidden');
    }
    $('#start').addEventListener('click', startSession);
    $('#next').addEventListener('click', nextExercise);
    $('#stop').addEventListener('click', () => finishSession(false));
    $('#dismissResult').addEventListener('click', () => $('#result').classList.add('hidden'));
    $('#minusWeight').addEventListener('click', () => changeWeight(-0.5));
    $('#plusWeight').addEventListener('click', () => changeWeight(0.5));
    $('#warmup').addEventListener('toggle', () => {
      if ($('#warmup').open) $('#warmupVideo').play().catch(() => {});
      else $('#warmupVideo').pause();
    });
    setInterval(tick, 1000);
    render();
  </script>
</body>
</html>
